---
- name: Restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted
  when: docker_allow_restart | bool

- name: Note pending docker restart
  ansible.builtin.debug:
    msg: daemon.json changed — restart docker in a quiet window (docker_allow_restart=true).
  when: not (docker_allow_restart | bool)
  listen: Restart docker
