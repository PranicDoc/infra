app_dir: /opt/pranicdoc

# Docker daemon settings change only take effect after a daemon restart, which
# restarts every container on the VM. Leave false unless you're in a window
# where UAT may blip.
docker_allow_restart: false

# The VM's docker-compose.yml and .env are NOT managed yet — the files on the
# VM stay the source of truth. Set to true once ansible/files/docker-compose.yml
# is a reviewed copy of the VM's file.
compose_managed: false

# Weekly cleanup of unused images (each deploy leaves the previous one behind).
image_prune_weekday: "0" # Sunday
image_prune_hour: "3"
