---
# Localhost tests for the version-pinning pieces of playbooks/deploy.yml (no VM, no Docker):
#   ansible-playbook tests/deploy-override.yml      (from ansible/)
- name: Deploy version pinning
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    marker: "# managed by infra ansible deploy.yml"
    override_file: /opt/pranicdoc/docker-compose.override.yml # same play var as deploy.yml
  tasks:
    - name: Scratch dir
      ansible.builtin.tempfile:
        state: directory
      register: scratch

    # ── pins accumulate ────────────────────────────────────────────────
    - name: Deploy ui v1.0.0 on top of a pinned cph
      ansible.builtin.include_tasks: ../playbooks/deploy-tasks/new-pins.yml
      vars:
        deployed_versions: {cph: "ghcr.io/pranicdoc/cph:v1.0.0"}
        services: [ui]
        version: v1.0.0
        service_images: {cph: ghcr.io/pranicdoc/cph, ui: ghcr.io/pranicdoc/cph-ui}

    - name: Render override from the new pins
      ansible.builtin.template:
        src: ../roles/app/templates/docker-compose.override.yml.j2
        dest: "{{ scratch.path }}/accumulate.yml"
        mode: "0644"
      vars:
        pinned_images: "{{ new_pins }}"

    - name: Read rendered override
      ansible.builtin.slurp:
        src: "{{ scratch.path }}/accumulate.yml"
      register: accumulate

    - name: "Pins accumulate: both services keep their image, marker first"
      vars:
        text: "{{ accumulate.content | b64decode }}"
        parsed: "{{ text | from_yaml }}"
      ansible.builtin.assert:
        that:
          - text.splitlines()[0].startswith(marker)
          - parsed.services.cph.image == 'ghcr.io/pranicdoc/cph:v1.0.0'
          - parsed.services.ui.image == 'ghcr.io/pranicdoc/cph-ui:v1.0.0'

    # ── rollback without previous pin ──────────────────────────────────
    - name: Rollback refs with no pins yet
      ansible.builtin.include_tasks: ../playbooks/deploy-tasks/rollback-refs.yml
      vars:
        services: [cph]
        deployed_versions: {}
        running_digests: {cph: "ghcr.io/pranicdoc/cph@sha256:abc123"}

    - name: "Rollback without previous pin: falls back to the running digest"
      ansible.builtin.assert:
        that:
          - rollback_versions.cph == 'ghcr.io/pranicdoc/cph@sha256:abc123'

    - name: Rollback refs with an existing pin
      ansible.builtin.include_tasks: ../playbooks/deploy-tasks/rollback-refs.yml
      vars:
        services: [cph]
        deployed_versions: {cph: "ghcr.io/pranicdoc/cph:v1.0.0", ui: "ghcr.io/pranicdoc/cph-ui:v1.0.0"}
        running_digests: {cph: "ghcr.io/pranicdoc/cph@sha256:abc123"}

    - name: "Rollback with a pin: previous pin wins, other pins kept"
      ansible.builtin.assert:
        that:
          - rollback_versions.cph == 'ghcr.io/pranicdoc/cph:v1.0.0'
          - rollback_versions.ui == 'ghcr.io/pranicdoc/cph-ui:v1.0.0'

    # ── foreign override refused ───────────────────────────────────────
    - name: Write an override we did not create
      ansible.builtin.copy:
        dest: "{{ scratch.path }}/docker-compose.override.yml"
        content: "services:\n  cph:\n    environment: [FOO=bar]\n"
        mode: "0644"

    - name: Check a foreign override
      block:
        - name: Run the override check
          ansible.builtin.include_tasks: ../playbooks/deploy-tasks/check-override.yml
          vars:
            override_path: "{{ scratch.path }}/docker-compose.override.yml"
        - name: Should not get here
          ansible.builtin.set_fact:
            foreign_refused: false
      rescue:
        - name: Remember the refusal
          ansible.builtin.set_fact:
            foreign_refused: true
            foreign_msg: "{{ ansible_failed_result.msg }}"

    - name: "Foreign override refused, naming the file"
      ansible.builtin.assert:
        that:
          - foreign_refused
          - "'docker-compose.override.yml' in foreign_msg"

    - name: Our own override passes the check
      ansible.builtin.include_tasks: ../playbooks/deploy-tasks/check-override.yml
      vars:
        override_path: "{{ scratch.path }}/accumulate.yml"

    # deploy.yml has a play var `override_file` (the override's path); the check must not
    # clobber it (2026-10-19 prod run: a registered result overwrote it, and writing the pins failed).
    - name: Check with the caller's override_file variable set
      ansible.builtin.include_tasks: ../playbooks/deploy-tasks/check-override.yml
      vars:
        override_path: "{{ scratch.path }}/accumulate.yml"

    - name: "Check leaves the caller's override_file untouched"
      ansible.builtin.assert:
        that:
          - override_file is string
          - override_file == '/opt/pranicdoc/docker-compose.override.yml'

    # ── legacy deploy (no version): unpins those services (review #2) ──
    - name: Legacy deploy of cph without a version
      ansible.builtin.include_tasks: ../playbooks/deploy-tasks/new-pins.yml
      vars:
        deployed_versions: {cph: "ghcr.io/pranicdoc/cph:v1.0.0", ui: "ghcr.io/pranicdoc/cph-ui:v1.0.0"}
        services: [cph]
        version: ""
        service_images: {cph: ghcr.io/pranicdoc/cph, ui: ghcr.io/pranicdoc/cph-ui}

    - name: "Legacy deploy: cph unpinned (back to compose's :latest), ui untouched"
      ansible.builtin.assert:
        that:
          - "'cph' not in new_pins"
          - new_pins.ui == 'ghcr.io/pranicdoc/cph-ui:v1.0.0'

    # ── rescue: only roll back what was restarted (review #4) ──────────
    - name: Rescue before any restart (login or pull failed)
      ansible.builtin.include_tasks: ../playbooks/deploy-tasks/rescue-pins.yml
      vars:
        restarted: false
        deployed_versions: {ui: "ghcr.io/pranicdoc/cph-ui:v1.0.0"}
        rollback_versions: {ui: "ghcr.io/pranicdoc/cph-ui:v1.0.0", cph: "ghcr.io/pranicdoc/cph@sha256:abc123"}

    - name: "Nothing restarted: pins go back exactly as they were, no restart"
      ansible.builtin.assert:
        that:
          - "restore_pins == {'ui': 'ghcr.io/pranicdoc/cph-ui:v1.0.0'}"
          - not restart_previous

    - name: Rescue after the restart
      ansible.builtin.include_tasks: ../playbooks/deploy-tasks/rescue-pins.yml
      vars:
        restarted: true
        deployed_versions: {ui: "ghcr.io/pranicdoc/cph-ui:v1.0.0"}
        rollback_versions: {ui: "ghcr.io/pranicdoc/cph-ui:v1.0.0", cph: "ghcr.io/pranicdoc/cph@sha256:abc123"}

    - name: "Restarted: roll back to the previous images and restart them"
      ansible.builtin.assert:
        that:
          - restore_pins.cph == 'ghcr.io/pranicdoc/cph@sha256:abc123'
          - restart_previous

    # ── one deploy at a time on the VM (review #6) ─────────────────────
    - name: Take the deploy lock
      ansible.builtin.include_tasks: ../playbooks/deploy-tasks/lock.yml
      vars:
        lock_path: "{{ scratch.path }}/.deploy.lock"

    - name: A second deploy can't take it
      block:
        - name: Try the lock again (no waiting)
          ansible.builtin.include_tasks: ../playbooks/deploy-tasks/lock.yml
          vars:
            lock_path: "{{ scratch.path }}/.deploy.lock"
            lock_retries: 0
        - name: Should not get here
          ansible.builtin.set_fact:
            second_locked: true
      rescue:
        - name: Remember it was refused
          ansible.builtin.set_fact:
            second_locked: false

    - name: "Lock: second deploy refused while the first holds it"
      ansible.builtin.assert:
        that:
          - not second_locked

    - name: Release the lock
      ansible.builtin.include_tasks: ../playbooks/deploy-tasks/unlock.yml
      vars:
        lock_path: "{{ scratch.path }}/.deploy.lock"

    - name: Take it again after release
      ansible.builtin.include_tasks: ../playbooks/deploy-tasks/lock.yml
      vars:
        lock_path: "{{ scratch.path }}/.deploy.lock"
        lock_retries: 0

    - name: Clean up
      ansible.builtin.file:
        path: "{{ scratch.path }}"
        state: absent
