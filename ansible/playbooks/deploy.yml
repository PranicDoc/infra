---
# Ship an exact version: pin the services to <repo>:<version> (docker-compose.override.yml, written
# from deployed-versions.yml), pull, restart only those services and wait for their healthchecks.
# If one stays unhealthy, put back what ran before, wait for it, and still fail the run.
# Run by .github/workflows/deploy-vm.yml after approval.
#
#   ansible-playbook playbooks/deploy.yml \
#     -e '{"services": ["cph", "ui"], "version": "v1.4.0", "registry_user": "...", "registry_token": "..."}'
- name: Deploy services on the prod VM
  hosts: prod
  gather_facts: false
  vars:
    services: []
    version: ""
    registry: ghcr.io
    registry_user: ""
    registry_token: ""
    health_retries: 30 # x 10 s = ~5 min per service
    versions_file: "{{ app_dir }}/deployed-versions.yml"
    override_file: "{{ app_dir }}/docker-compose.override.yml"
  tasks:
    - name: Services and version were given
      ansible.builtin.assert:
        that:
          - services | length > 0
          - version | length > 0
          - services | difference(service_images.keys()) | length == 0
        fail_msg: >-
          Pass -e '{"services": ["cph"], "version": "v1.4.0"}'; services must be among
          {{ service_images.keys() | list }}

    - name: Never overwrite an override we didn't write
      ansible.builtin.include_tasks: deploy-tasks/check-override.yml
      vars:
        override_path: "{{ override_file }}"

    - name: Current pins file
      ansible.builtin.stat:
        path: "{{ versions_file }}"
      register: versions_stat

    - name: Read current pins
      when: versions_stat.stat.exists
      ansible.builtin.slurp:
        src: "{{ versions_file }}"
      register: versions_raw

    - name: Current pins
      ansible.builtin.set_fact:
        deployed_versions: "{{ (versions_raw.content | b64decode | from_yaml) if versions_stat.stat.exists else {} }}"

    # Repo digest of the image each container runs now — the rollback target when a service has
    # no pin yet (first versioned deploy). A service that isn't running yields nothing.
    - name: Image each service runs now
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          docker image inspect -f '{% raw %}{{index .RepoDigests 0}}{% endraw %}'
          "$(docker inspect -f '{% raw %}{{.Image}}{% endraw %}' "$(docker compose ps -q {{ item }})")"
        chdir: "{{ app_dir }}"
        executable: /bin/bash
      loop: "{{ services }}"
      register: running
      changed_when: false
      failed_when: false

    - name: Running digests
      vars:
        found: "{{ running.results | selectattr('rc', 'eq', 0) | selectattr('stdout', 'search', '@sha256:') | list }}"
      ansible.builtin.set_fact:
        running_digests: "{{ dict(found | map(attribute='item') | zip(found | map(attribute='stdout'))) }}"

    - name: What to roll back to
      ansible.builtin.include_tasks: deploy-tasks/rollback-refs.yml

    - name: Deploy and verify
      block:
        - name: Log in to the registry
          when: registry_token | length > 0
          ansible.builtin.command:
            cmd: docker login {{ registry }} -u {{ registry_user }} --password-stdin
            stdin: "{{ registry_token }}"
          no_log: true
          changed_when: false

        - name: Work out the new pins
          ansible.builtin.include_tasks: deploy-tasks/new-pins.yml

        - name: Pin the new version
          ansible.builtin.include_tasks: deploy-tasks/write-pins.yml
          vars:
            pins: "{{ new_pins }}"

        - name: Pull images
          ansible.builtin.command:
            cmd: docker compose pull {{ services | join(' ') }}
            chdir: "{{ app_dir }}"
          changed_when: true

        - name: Restart only these services
          ansible.builtin.command:
            cmd: docker compose up -d --no-deps {{ services | join(' ') }}
            chdir: "{{ app_dir }}"
          changed_when: true

        - name: Wait for the new version
          ansible.builtin.include_tasks: deploy-tasks/wait-healthy.yml
          vars:
            wait_services: "{{ services }}"

      rescue:
        - name: Logs of the services that failed
          ansible.builtin.command:
            cmd: docker compose logs --tail=80 {{ services | join(' ') }}
            chdir: "{{ app_dir }}"
          register: failure_logs
          changed_when: false
          failed_when: false

        - name: Show logs
          ansible.builtin.debug:
            var: failure_logs.stdout_lines

        - name: Put back what ran before
          ansible.builtin.include_tasks: deploy-tasks/write-pins.yml
          vars:
            pins: "{{ rollback_versions }}"

        - name: Restart the previous version
          ansible.builtin.command:
            cmd: docker compose up -d --no-deps {{ services | join(' ') }}
            chdir: "{{ app_dir }}"
          changed_when: true
          failed_when: false

        - name: Wait for the previous version
          ansible.builtin.include_tasks: deploy-tasks/wait-healthy.yml
          vars:
            wait_services: "{{ services }}"

        - name: Fail the deploy
          ansible.builtin.fail:
            msg: >-
              {{ services | join(', ') }} at {{ version }} did not become healthy (logs above).
              Rolled back to the previous images: {{ rollback_versions }}

      always:
        - name: Log out of the registry
          when: registry_token | length > 0
          ansible.builtin.command:
            cmd: docker logout {{ registry }}
          changed_when: false
          failed_when: false

    - name: Remove dangling images
      ansible.builtin.command:
        cmd: docker image prune -f
      changed_when: false
