name: Deploy to Cloud Run (reusable)

# Called from cph / pdfWorker / credit-service after their image is pushed to
# Artifact Registry. Only swaps the image — env, secrets, scaling and IAM are
# owned by tofu/. If the new revision fails its health check, traffic goes
# straight back to the previous revision.
#
# Same call for every environment. The CALLER repo needs a GitHub Environment of
# that name with variables GCP_PROJECT_ID, GCP_REGION, GCP_WORKLOAD_IDENTITY_PROVIDER,
# GCP_SERVICE_ACCOUNT (the deployer SA), optional GCP_ARTIFACT_REPO (default all-in-one).
#
#   deploy:
#     needs: build
#     permissions: { contents: read, id-token: write, issues: write }   # issues: approval gate
#     uses: PranicDoc/infra/.github/workflows/deploy-cloudrun.yml@main
#     with:
#       environment: uat
#       service: cph                       # Cloud Run service name
#       image_name: cph                    # Artifact Registry image name
#       image_tag: sha-abc1234             # from the build job (never latest)
#       health_path: /cph/actuator/health

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      service:
        type: string
        required: true
      image_name:
        description: Artifact Registry image name (defaults to the service name)
        type: string
        default: ""
      image_tag:
        description: Tag pushed by the build, e.g. sha-abc1234
        type: string
        required: true
      health_path:
        type: string
        default: /actuator/health
      approvers:
        description: GitHub users (comma-separated) who must approve before anything is deployed
        type: string
        default: user-lee-005

jobs:
  approval:
    if: inputs.environment == 'prod'
    permissions:
      issues: write
    uses: PranicDoc/infra/.github/workflows/approval.yml@main
    with:
      title: "Deploy ${{ inputs.service }}:${{ inputs.image_tag }} to Cloud Run (${{ inputs.environment }})"
      details: |
        **Service:** `${{ inputs.service }}` · **image tag:** `${{ inputs.image_tag }}` · **Cloud Run environment:** `${{ inputs.environment }}`
      approvers: ${{ inputs.approvers }}
  deploy:
    needs: approval
    # Approval only for prod; run when it was skipped, never after a denied/failed approval.
    if: always() && (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE: ${{ inputs.service }}
      REGION: ${{ vars.GCP_REGION }}
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO || 'all-in-one' }}/${{ inputs.image_name || inputs.service }}:${{ inputs.image_tag }}
    steps:
      - name: Cloud Run is set up for this service
        env:
          WIF: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          case "$SERVICE" in
            cph|creditservice) ;;
            *) echo "::error::$SERVICE has no Cloud Run service (only cph and creditservice run on Cloud Run)"; exit 1 ;;
          esac
          if [ -z "$WIF" ]; then
            echo "::error::Cloud Run is not set up yet (run bootstrap-gcp.sh): GCP_WORKLOAD_IDENTITY_PROVIDER is empty in environment '${{ inputs.environment }}'"
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Remember current revision
        id: prev
        run: |
          PREV=$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" \
                   --format='value(status.latestReadyRevisionName)')
          echo "revision=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous revision: $PREV"

      - name: Roll out new image
        run: |
          gcloud run deploy "$SERVICE" --project="$PROJECT" --region="$REGION" \
            --image="$IMAGE" --quiet

      - name: Health check
        id: health
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format='value(status.url)')
          TOKEN=$(gcloud auth print-identity-token --audiences="$URL")
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$URL${{ inputs.health_path }}" || true)
            echo "attempt $i: HTTP $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::$SERVICE unhealthy after rollout"
          exit 1

      - name: Roll back traffic
        if: failure() && steps.prev.outputs.revision != ''
        run: |
          gcloud run services update-traffic "$SERVICE" --project="$PROJECT" --region="$REGION" \
            --to-revisions="${{ steps.prev.outputs.revision }}=100"
          echo "Rolled back to ${{ steps.prev.outputs.revision }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: success()
        run: echo "Deployed \`$IMAGE\` to **$SERVICE** ($PROJECT)" >> "$GITHUB_STEP_SUMMARY"
