name: Ansible — prod VM

# PR / merge to main touching ansible/ -> lint + syntax check only.
# Run workflow (manual)                -> provision the prod VM (packages, Docker settings,
#                                         deploy script); defaults to a dry run (--check --diff).
# Manual-only on purpose: GitHub Free can't require a reviewer on private-repo Environments,
# so "Run workflow" is the human approval step for touching prod.
#
# Secrets (environment `prod`): VM_HOST, VM_USER, and VM_SSH_KEY or VM_PASSWORD.

on:
  push:
    branches: [main]
    paths: ["ansible/**", ".github/workflows/ansible.yml"]
  pull_request:
    paths: ["ansible/**", ".github/actions/ansible-vm/**", ".github/workflows/ansible.yml"]
  workflow_dispatch:
    inputs:
      check_only:
        description: Dry run (--check --diff)
        type: boolean
        default: true

concurrency:
  group: ansible-prod
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: ansible

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install ansible-core==2.17.* ansible-lint==24.*
      - run: ansible-galaxy collection install -r requirements.yml
      - run: ansible-playbook playbooks/provision.yml playbooks/deploy.yml --syntax-check
      - run: ansible-lint playbooks/provision.yml playbooks/deploy.yml

  approval:
    needs: lint
    if: github.event_name == 'workflow_dispatch'
    permissions:
      issues: write
    uses: ./.github/workflows/approval.yml
    with:
      title: "Provision the prod VM (${{ inputs.check_only && 'dry run' || 'APPLY' }})"
      details: |
        Runs `ansible/playbooks/provision.yml` on the prod VM — packages, Docker log rotation, image prune cron.
        Mode: **${{ inputs.check_only && 'dry run (--check --diff), changes nothing' || 'apply' }}**

  provision:
    needs: approval
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ansible-vm
        with:
          playbook: provision.yml
          check: ${{ inputs.check_only }}
          host: ${{ secrets.VM_HOST }}
          user: ${{ secrets.VM_USER }}
          ssh_key: ${{ secrets.VM_SSH_KEY }}
          password: ${{ secrets.VM_PASSWORD }}