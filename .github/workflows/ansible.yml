name: Ansible — prod VM

# PR / merge to main touching ansible/ -> lint + syntax check only.
# Run workflow (manual)                -> provision the prod VM (packages, Docker settings,
#                                         deploy script); defaults to a dry run (--check --diff).
# Manual-only on purpose: GitHub Free can't require a reviewer on private-repo Environments,
# so "Run workflow" is the human approval step for touching prod.
#
# Secrets: VM_HOST, VM_SSH_USER, VM_SSH_KEY (same as deploy-vm.yml).

on:
  push:
    branches: [main]
    paths: ["ansible/**", ".github/workflows/ansible.yml"]
  pull_request:
    paths: ["ansible/**", ".github/workflows/ansible.yml"]
  workflow_dispatch:
    inputs:
      check_only:
        description: Dry run (--check --diff)
        type: boolean
        default: true

concurrency:
  group: ansible-prod
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: ansible

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install ansible-core==2.17.* ansible-lint==24.*
      - run: ansible-galaxy collection install -r requirements.yml
      - run: ansible-playbook playbooks/provision.yml --syntax-check
      - run: ansible-lint playbooks/provision.yml

  provision:
    needs: lint
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: vm-prod
    steps:
      - uses: actions/checkout@v4
      - run: pip install ansible-core==2.17.*
      - run: ansible-galaxy collection install -r requirements.yml

      - name: SSH key
        env:
          KEY: ${{ secrets.VM_SSH_KEY }}
          HOST: ${{ secrets.VM_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/vm && chmod 600 ~/.ssh/vm
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Run playbook
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
        run: |
          FLAGS=""
          if [ "${{ inputs.check_only }}" = "true" ]; then
            FLAGS="--check --diff"
          fi
          ansible-playbook playbooks/provision.yml $FLAGS \
            -e ansible_host="$VM_HOST" -e ansible_user="$VM_SSH_USER" \
            --private-key ~/.ssh/vm
