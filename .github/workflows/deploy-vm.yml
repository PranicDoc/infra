name: Deploy to prod VM (reusable)

# Approval (prod), then Ansible: ansible/playbooks/deploy.yml pins the services to
# <image>:<version> (docker-compose.override.yml), pulls, restarts only those services and waits for
# their healthchecks. If one stays unhealthy it puts back the previous images and still fails.
# With a version, the VM pulls with this run's GITHUB_TOKEN (in a throwaway Docker config), so the
# CALLER must grant packages: read. Without one (legacy callers passing only image_tag) the
# services are unpinned and pulled with the VM's own saved login, as before.
#
#   deploy:
#     needs: [resolve, build]
#     permissions: { contents: read, issues: write, packages: read }   # this deploy job inherits these
#     uses: PranicDoc/infra/.github/workflows/deploy-vm.yml@main
#     with:
#       services: cph ui
#       version: ${{ needs.resolve.outputs.version }}   # v1.4.0 or sha-abc1234
#       environment: prod
#     secrets: inherit   # VM_HOST, VM_USER, and VM_SSH_KEY or VM_PASSWORD

on:
  workflow_call:
    inputs:
      services:
        description: Space-separated docker compose service names, e.g. "cph ui"
        type: string
        required: true
      version:
        description: Image tag to deploy and pin, e.g. v1.4.0 or sha-abc1234
        type: string
        default: ""
      image_tag:
        description: Deprecated alias of version (old build-and-push callers); used when version is empty
        type: string
        default: latest
      environment:
        description: prod or uat — shown on the approval issue and summary; prod requires approval
        type: string
        default: prod
      approvers:
        description: GitHub users (comma-separated) allowed to approve
        type: string
        default: user-lee-005
    secrets:
      VM_HOST:
        required: true
      VM_USER:
        required: true
      VM_SSH_KEY:
        required: false
      VM_PASSWORD:
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate environment
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          case "$ENVIRONMENT" in
            prod|uat) ;;
            *) echo "::error::environment must be prod or uat; got '$ENVIRONMENT'"; exit 1 ;;
          esac

  approval:
    needs: check
    # Only an exact 'uat' skips approval; check already rejected anything but prod/uat.
    if: inputs.environment != 'uat'
    permissions:
      issues: write
    uses: PranicDoc/infra/.github/workflows/approval.yml@main
    with:
      title: "Deploy ${{ inputs.services }} ${{ inputs.version || inputs.image_tag }} to the VM (${{ inputs.environment }})"
      details: |
        **Services:** `${{ inputs.services }}` · **version:** `${{ inputs.version || inputs.image_tag }}` · **target:** VM · **environment:** ${{ inputs.environment }}
      approvers: ${{ inputs.approvers }}

  deploy:
    needs: [check, approval]
    # Approval is skipped only for uat; run then, but never after a denied/failed approval.
    # No permissions block: it inherits the caller's (legacy callers grant no packages scope).
    if: always() && needs.check.result == 'success' && (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Extra vars
        id: vars
        env:
          SERVICES: ${{ inputs.services }}
          # Only a real version pins and logs in; image_tag-only (legacy) callers deploy unpinned
          # with the VM's saved login.
          VERSION: ${{ inputs.version }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ inputs.version != '' && secrets.GITHUB_TOKEN || '' }}
        run: |
          json=$(jq -cn --arg s "$SERVICES" --arg v "$VERSION" --arg u "$REGISTRY_USER" --arg t "$REGISTRY_TOKEN" \
            '{services: ($s | split(" ") | map(select(. != ""))), version: $v, registry_user: $u, registry_token: $t}')
          [ -z "$REGISTRY_TOKEN" ] || echo "::add-mask::$REGISTRY_TOKEN"
          echo "json=$json" >> "$GITHUB_OUTPUT"

      - uses: PranicDoc/infra/.github/actions/ansible-vm@main
        with:
          playbook: deploy.yml
          extra_vars: ${{ steps.vars.outputs.json }}
          host: ${{ secrets.VM_HOST }}
          user: ${{ secrets.VM_USER }}
          ssh_key: ${{ secrets.VM_SSH_KEY }}
          password: ${{ secrets.VM_PASSWORD }}

      - name: Summary
        if: success()
        run: echo "Deployed \`${{ inputs.services }}\` at \`${{ inputs.version || inputs.image_tag }}\` to the VM (${{ inputs.environment }})" >> "$GITHUB_STEP_SUMMARY"
