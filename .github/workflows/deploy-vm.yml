name: Deploy to prod VM (reusable)

# Approval, then Ansible: ansible/playbooks/deploy.yml pulls the services' current images, restarts
# only those services and waits for their healthchecks (prints logs and fails if one stays
# unhealthy). Nothing happens until an approver comments "approve" on the issue approval.yml opens.
#
#   deploy:
#     needs: build
#     permissions: { contents: read, issues: write }   # issues: approval gate
#     uses: PranicDoc/infra/.github/workflows/deploy-vm.yml@main
#     with:
#       services: cph
#       image_tag: ${{ needs.build.outputs.image_tag }}   # shown on the approval issue
#     secrets: inherit   # VM_HOST, VM_USER, and VM_SSH_KEY or VM_PASSWORD

on:
  workflow_call:
    inputs:
      services:
        description: Space-separated docker compose service names, e.g. "cph ui"
        type: string
        required: true
      image_tag:
        description: What is being deployed (informational, shown on the approval issue)
        type: string
        default: latest
      approvers:
        description: GitHub users (comma-separated) allowed to approve
        type: string
        default: user-lee-005
    secrets:
      VM_HOST:
        required: true
      VM_USER:
        required: true
      VM_SSH_KEY:
        required: false
      VM_PASSWORD:
        required: false

jobs:
  approval:
    permissions:
      issues: write
    uses: PranicDoc/infra/.github/workflows/approval.yml@main
    with:
      title: "Deploy ${{ inputs.services }} (${{ inputs.image_tag }}) to the prod VM"
      details: |
        **Services:** `${{ inputs.services }}` · **image:** `${{ inputs.image_tag }}` · **target:** prod VM
      approvers: ${{ inputs.approvers }}

  deploy:
    needs: approval
    runs-on: ubuntu-latest
    steps:
      - name: Services as JSON
        id: vars
        env:
          SERVICES: ${{ inputs.services }}
        run: |
          echo "json=$(jq -cn --arg s "$SERVICES" '{services: ($s | split(" ") | map(select(. != "")))}')" >> "$GITHUB_OUTPUT"

      - uses: PranicDoc/infra/.github/actions/ansible-vm@main
        with:
          playbook: deploy.yml
          extra_vars: ${{ steps.vars.outputs.json }}
          host: ${{ secrets.VM_HOST }}
          user: ${{ secrets.VM_USER }}
          ssh_key: ${{ secrets.VM_SSH_KEY }}
          password: ${{ secrets.VM_PASSWORD }}

      - name: Summary
        if: success()
        run: echo "Deployed \`${{ inputs.services }}\` (${{ inputs.image_tag }}) to the prod VM" >> "$GITHUB_STEP_SUMMARY"
