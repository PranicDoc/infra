name: Build image (reusable)

# One build for every service. Builds the Docker image once, pushes it to GHCR, and — when
# `gar_environment` is set — copies that exact image to Google Artifact Registry (no rebuild).
#
# Tags: sha-<short sha> always; `latest` too on the default branch (unless tag_latest: false).
# Pull requests build but don't push.
#
# Caller example:
#
#   build:
#     permissions: { contents: read, packages: write, id-token: write }
#     uses: PranicDoc/infra/.github/workflows/build-image.yml@main
#     with:
#       image_name: cph
#       context: app
#       use_gpr_key: true            # build needs GitHub Packages (common-dtos, storageService)
#       gar_environment: uat         # optional: also publish to that environment's Artifact Registry
#     secrets: inherit
#
#   deploy:
#     needs: build                   # needs.build.outputs.image_tag -> sha-abc1234
#
# gar_environment needs, in the CALLER repo's GitHub Environment of that name: variables
# GCP_PROJECT_ID, GCP_REGION, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT (deployer),
# optional GCP_ARTIFACT_REPO (default all-in-one).

on:
  workflow_call:
    inputs:
      image_name:
        description: Image name, e.g. cph, cph-ui, pdfworker, creditservice
        type: string
        required: true
      context:
        description: Docker build context (directory with the Dockerfile)
        type: string
        default: "."
      dockerfile:
        description: Dockerfile path, if not <context>/Dockerfile
        type: string
        default: ""
      build_args:
        description: Extra build args, one KEY=value per line (non-secret)
        type: string
        default: ""
      use_gpr_key:
        description: Pass GPR_USER / GPR_KEY build args (secrets.GPR_KEY) for GitHub Packages
        type: boolean
        default: false
      ref:
        description: Git ref to build (blank = the triggering ref)
        type: string
        default: ""
      tag_latest:
        description: Also tag `latest` when building the default branch
        type: boolean
        default: true
      push:
        description: Push the image (pull requests never push)
        type: boolean
        default: true
      gar_environment:
        description: GitHub Environment whose Artifact Registry also receives the image (blank = GHCR only)
        type: string
        default: ""
    secrets:
      GPR_KEY:
        required: false
    outputs:
      image_tag:
        description: Immutable tag pushed, e.g. sha-abc1234
        value: ${{ jobs.build.outputs.image_tag }}
      image:
        description: Full GHCR reference with the immutable tag
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      image: ${{ steps.tag.outputs.image }}
    env:
      PUSH: ${{ inputs.push && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # The tag comes from the commit actually checked out — with `ref` set that isn't github.sha.
      - name: Image name and tag
        id: name
        run: |
          echo "ghcr=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.image_name }}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.ghcr }}
          tags: |
            type=raw,value=latest,enable=${{ inputs.tag_latest && inputs.ref == '' && github.ref_name == github.event.repository.default_branch }}
            type=raw,value=${{ steps.name.outputs.tag }}

      - name: Build args
        id: args
        env:
          EXTRA: ${{ inputs.build_args }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
        run: |
          {
            echo 'list<<__ARGS__'
            if [ "${{ inputs.use_gpr_key }}" = "true" ]; then
              [ -n "$GPR_KEY" ] || { echo "::error::use_gpr_key is set but secrets.GPR_KEY is empty (pass secrets: inherit)"; exit 1; }
              echo "GPR_USER=${{ github.actor }}"
              echo "GPR_KEY=$GPR_KEY"
            fi
            [ -z "$EXTRA" ] || printf '%s\n' "$EXTRA"
            echo '__ARGS__'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile || format('{0}/Dockerfile', inputs.context) }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.args.outputs.list }}
          cache-from: type=gha,scope=${{ inputs.image_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}

      - name: Output tag
        id: tag
        run: |
          TAG="${{ steps.name.outputs.tag }}"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=${{ steps.name.outputs.ghcr }}:$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ inputs.image_name }}"
            echo "- \`${{ steps.name.outputs.ghcr }}:$TAG\` ($([ "$PUSH" = true ] && echo pushed || echo 'built, not pushed'))"
          } >> "$GITHUB_STEP_SUMMARY"

  # Same image, copied registry-to-registry: what runs on Cloud Run is byte-identical to GHCR's.
  artifact-registry:
    needs: build
    if: ${{ inputs.gar_environment != '' && inputs.push && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.gar_environment }}
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Copy to Artifact Registry
        env:
          SRC: ${{ needs.build.outputs.image }}
          DEST: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO || 'all-in-one' }}/${{ inputs.image_name }}
          TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          docker buildx imagetools create --tag "$DEST:$TAG" "$SRC"
          echo "- copied to \`$DEST:$TAG\`" >> "$GITHUB_STEP_SUMMARY"
