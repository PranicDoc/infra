name: OpenTofu

# One codebase, any environment. Pick the environment; every value comes from the GitHub Environment
# of that name (same variable / secret names everywhere) plus tofu/envs/<environment>.tfvars.
#
#   PR / merge to main touching tofu/  -> plan for `uat`
#   Run workflow, apply = true         -> plan, sync secrets into Secret Manager, apply that exact plan
#   Run workflow, secrets_only = true  -> only sync secrets (rotate a password without touching infra)
#
# Apply is manual-only on purpose: the org is on GitHub Free, where private-repo Environments can't
# require a reviewer, so "Run workflow" is the human approval step.
#
# Per GitHub Environment (Settings -> Environments -> <env>):
#   Variables
#     GCP_PROJECT_ID, GCP_PROJECT_NUMBER, GCP_REGION, GCP_BILLING_ACCOUNT, TF_STATE_BUCKET,
#     GCP_WORKLOAD_IDENTITY_PROVIDER, TOFU_SERVICE_ACCOUNT          (printed by bootstrap-gcp.sh)
#     One full set per service (repeat values where services share a server):
#       CPH_DB_HOST / _NAME / _USERNAME / [_PORT, _POOLER_HOST]
#       CREDIT_DB_HOST / _NAME / _USERNAME / [_PORT, _POOLER_HOST]
#       PDF_WORKER_DB_HOST / _NAME / _USERNAME / [_PORT, _POOLER_HOST]   (= cph's database)
#     GOOGLE_CLIENT_ID, R2_ENDPOINT, MAIL_USERNAME, REDIS_HOST, [WHATSAPP_PHONE_NUMBER_ID]
#   Secrets (unset = keep the current Secret Manager value)
#     CPH_DB_PASSWORD, CREDIT_DB_PASSWORD, PDF_WORKER_DB_PASSWORD, JWT_SECRET, ENCRYPTION_KEY, INTERNAL_API_KEY,
#     GOOGLE_CLIENT_SECRET, R2_ACCESS_KEY, R2_SECRET_KEY, CREDIT_API_KEY, MAIL_PASSWORD, REDIS_PASSWORD

on:
  pull_request:
    paths: ["tofu/**", "scripts/ci/**", ".github/workflows/tofu.yml"]
  push:
    branches: [main]
    paths: ["tofu/**", "scripts/ci/**", ".github/workflows/tofu.yml"]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment (GitHub Environment + tofu/envs/<name>.tfvars)
        type: choice
        options: [uat]
        default: uat
      apply:
        description: Apply the plan (after syncing secrets)
        type: boolean
        default: false
      secrets_only:
        description: Only sync secrets into Secret Manager (no plan / apply)
        type: boolean
        default: false

concurrency:
  group: tofu-${{ inputs.environment || 'uat' }}
  cancel-in-progress: false # never interrupt an apply

permissions:
  contents: read
  id-token: write

env:
  ENV_NAME: ${{ inputs.environment || 'uat' }}
  TOFU_VERSION: 1.13.1

jobs:
  plan:
    if: ${{ !inputs.secrets_only }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'uat' }}
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_project_number: ${{ vars.GCP_PROJECT_NUMBER }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_billing_account_id: ${{ vars.GCP_BILLING_ACCOUNT }}
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TOFU_SERVICE_ACCOUNT }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Environment variables -> tofu/ci.auto.tfvars.json
        env:
          CPH_DB_HOST: ${{ vars.CPH_DB_HOST }}
          CPH_DB_PORT: ${{ vars.CPH_DB_PORT }}
          CPH_DB_NAME: ${{ vars.CPH_DB_NAME }}
          CPH_DB_USERNAME: ${{ vars.CPH_DB_USERNAME }}
          CPH_DB_POOLER_HOST: ${{ vars.CPH_DB_POOLER_HOST }}
          PDF_WORKER_DB_HOST: ${{ vars.PDF_WORKER_DB_HOST }}
          PDF_WORKER_DB_PORT: ${{ vars.PDF_WORKER_DB_PORT }}
          PDF_WORKER_DB_NAME: ${{ vars.PDF_WORKER_DB_NAME }}
          PDF_WORKER_DB_USERNAME: ${{ vars.PDF_WORKER_DB_USERNAME }}
          PDF_WORKER_DB_POOLER_HOST: ${{ vars.PDF_WORKER_DB_POOLER_HOST }}
          CREDIT_DB_HOST: ${{ vars.CREDIT_DB_HOST }}
          CREDIT_DB_PORT: ${{ vars.CREDIT_DB_PORT }}
          CREDIT_DB_NAME: ${{ vars.CREDIT_DB_NAME }}
          CREDIT_DB_USERNAME: ${{ vars.CREDIT_DB_USERNAME }}
          CREDIT_DB_POOLER_HOST: ${{ vars.CREDIT_DB_POOLER_HOST }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          MAIL_USERNAME: ${{ vars.MAIL_USERNAME }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
        run: bash scripts/ci/write-tfvars.sh tofu/ci.auto.tfvars.json

      - name: Init / validate
        working-directory: tofu
        run: |
          tofu fmt -recursive -check
          tofu init -input=false -backend-config="bucket=${TF_VAR_state_bucket}" -backend-config="prefix=${ENV_NAME}"
          tofu validate

      - name: Plan
        working-directory: tofu
        run: |
          tofu plan -input=false -var-file="envs/${ENV_NAME}.tfvars" -out=tfplan -no-color | tee plan.txt
          {
            echo "## OpenTofu plan — ${ENV_NAME}"
            echo '```'
            grep -E '^(Plan:|No changes|  # )' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.apply }}
        with:
          name: tfplan-${{ env.ENV_NAME }}
          path: tofu/tfplan
          retention-days: 1

  apply:
    needs: plan
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply && !inputs.secrets_only && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TOFU_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Before apply: a new Cloud Run revision needs every referenced secret to have a value.
      - name: Sync secrets -> Secret Manager
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          CPH_DB_PASSWORD: ${{ secrets.CPH_DB_PASSWORD }}
          PDF_WORKER_DB_PASSWORD: ${{ secrets.PDF_WORKER_DB_PASSWORD }}
          CREDIT_DB_PASSWORD: ${{ secrets.CREDIT_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          CREDIT_API_KEY: ${{ secrets.CREDIT_API_KEY }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: bash scripts/ci/sync-secrets.sh

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ env.ENV_NAME }}
          path: tofu

      # The saved plan carries every variable value, so no tfvars are needed here.
      - name: Apply the reviewed plan
        working-directory: tofu
        run: |
          tofu init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="prefix=${ENV_NAME}"
          tofu apply -input=false tfplan

  secrets-only:
    if: ${{ inputs.secrets_only }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TOFU_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Sync secrets -> Secret Manager
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          CPH_DB_PASSWORD: ${{ secrets.CPH_DB_PASSWORD }}
          PDF_WORKER_DB_PASSWORD: ${{ secrets.PDF_WORKER_DB_PASSWORD }}
          CREDIT_DB_PASSWORD: ${{ secrets.CREDIT_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          CREDIT_API_KEY: ${{ secrets.CREDIT_API_KEY }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: bash scripts/ci/sync-secrets.sh
