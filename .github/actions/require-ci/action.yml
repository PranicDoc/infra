name: Require green CI
description: Passes once the caller repo CI workflow succeeded for this exact commit (waits for a running one); fails if it failed

inputs:
  sha:
    description: Commit SHA that must have a successful CI run
    required: true
  workflow:
    description: CI workflow file in the caller repo
    required: false
    default: ci.yml
  wait_minutes:
    description: How long to wait for a CI run that is queued, running or not yet started
    required: false
    default: "10"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}   # caller job needs actions: read
        REPO: ${{ github.repository }}
        SHA: ${{ inputs.sha }}
        WORKFLOW: ${{ inputs.workflow }}
        WAIT_MINUTES: ${{ inputs.wait_minutes }}
      run: |
        # Release often follows a merge by seconds: wait for CI that is still running (or not yet
        # started) instead of failing, but fail at once if it finished unsuccessfully.
        deadline=$((SECONDS + ${WAIT_MINUTES} * 60))
        while true; do
          rows=$(gh run list -R "$REPO" --workflow "$WORKFLOW" --commit "$SHA" --limit 20 \
                   --json status,conclusion --jq '.[] | "\(.status) \(.conclusion)"')
          if echo "$rows" | grep -q '^completed success$'; then
            echo "CI passed for ${SHA:0:7}"
            exit 0
          fi
          if echo "$rows" | grep -Eq '^(queued|in_progress|waiting|requested|pending) '; then
            state="still running"
          elif [ -n "$rows" ]; then
            echo "::error::$WORKFLOW did not succeed for ${SHA:0:7} in $REPO (${rows//$'\n'/, }). Fix CI and try again."
            exit 1
          else
            state="not started yet"
          fi
          if [ "$SECONDS" -ge "$deadline" ]; then
            echo "::error::$WORKFLOW is $state for ${SHA:0:7} in $REPO after ${WAIT_MINUTES} min. Wait for CI and try again."
            exit 1
          fi
          echo "$WORKFLOW $state for ${SHA:0:7}; checking again in 15 s"
          sleep 15
        done
